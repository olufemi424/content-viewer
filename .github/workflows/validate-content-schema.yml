name: Validate content schema

on:
  pull_request:
    paths:
      - 'content/**/*.md'
      - 'scripts/validate-content-schema.mjs'
      - 'scripts/validate-content-schema.test.mjs'
      - 'scripts/content-pr-generation-boundary.test.mjs'
      - 'package.json'
      - '.github/workflows/validate-content-schema.yml'

jobs:
  validate-content-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:content-schema
      - run: npm run validate:content-schema -- --changed origin/${{ github.base_ref }}
